name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Explicitly define minimal permissions across the workflow (Least Privilege Principle)
permissions:
  contents: read

jobs:
  build-and-verify:
    name: Build & Static Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Build & Astro Edge Verification
        run: npm run build

      - name: Dependency Security Audit
        run: npm audit --audit-level=high
        continue-on-error: true
