name: 🐛 Bug Report
description: Report a reproducible bug or unexpected behavior in the application
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much relevant detail as possible so we can reproduce and fix it quickly.
        
        > **Security Notice**: If this is a sensitive security vulnerability, please report it via [Private Vulnerability Reporting](https://github.com/AndrewWangDev/My-Personal-Blog/security/advisories/new) or email `me@andrewwangdev.com` instead of submitting this public issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened and what went wrong...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component / Area
      description: Select the architectural area where the issue occurred.
      options:
        - "Edge Middleware & Security Headers"
        - "Authentication (Passkey / OAuth / PBKDF2 / Session)"
        - "Blog & Interactive Comments / Reactions"
        - "Admin Dashboard & Data Cascade"
        - "UI Layout & Dark Mode"
        - "Build & Tooling (Astro / Wrangler / Vite)"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Navigate to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. Observe error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: Expected ... but received ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment & Runtime Details
      description: Provide browser, device, Node, or OS details if applicable.
      placeholder: |
        - OS: [e.g. Windows 11, macOS Sequoia, Ubuntu 24.04]
        - Browser: [e.g. Chrome 130, Safari 18, Firefox 132]
        - Node Version: [e.g. 22.11.0]
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Screenshots
      description: Paste any browser console errors, HTTP responses, or terminal logs.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I have verified this is not a sensitive security vulnerability (0-day).
          required: true
